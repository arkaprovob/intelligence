<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Service Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Red Hat Display', sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease;
        }
        .menu-bar {
            background-color: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .menu-bar a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        .menu-bar a:hover, .menu-bar a.active {
            background-color: #ee0000;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(238, 0, 0, 0.1);
            padding: 20px;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #ee0000;
            text-align: center;
            margin-bottom: 30px;
        }
        .service {
            background-color: #333333;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            transition: all 0.3s ease;
        }
        .service:hover {
            transform: translateX(10px);
            box-shadow: 0 0 15px rgba(238, 0, 0, 0.2);
        }
        .service-name {
            font-weight: bold;
            flex: 1 0 100%;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .service-status {
            font-weight: bold;
            margin-right: 10px;
        }
        .service-details {
            font-size: 0.9em;
            color: #b0b0b0;
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 10px;
        }
        .service-detail {
            background-color: #444;
            border-radius: 4px;
            padding: 5px 10px;
            margin-right: 10px;
            margin-bottom: 5px;
        }
        .status-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 15px;
            transition: all 0.3s ease;
        }
        .green {
            background-color: #28a745;
            box-shadow: 0 0 10px #28a745;
        }
        .red {
            background-color: #dc3545;
            box-shadow: 0 0 10px #dc3545;
        }
        .status-icon.green, .status-icon.red {
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        #last-updated {
            text-align: center;
            font-size: 0.9em;
            color: #888;
            margin-top: 20px;
        }
        @keyframes heartbeat {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .heartbeat {
            animation: heartbeat 0.5s ease-in-out;
        }
    </style>
</head>
<body>
<div class="menu-bar" id="menuBar">
    <a class="active" href="home.html"><i class="fas fa-home"></i> Home</a>
    <a href="ingestion.html"><i class="fas fa-file-upload"></i> Ingestion</a>
    <a href="qna.html"><i class="fa-solid fa-file-circle-question"></i> Q&A</a>
</div>
<div class="container">
    <h1>Service Status</h1>
    <div id="services-container"></div>
    <div id="last-updated"></div>
</div>

<script>
    const POLL_INTERVAL = 3000; // 3 seconds

    async function fetchStatus() {
        try {
            const response = await fetch('http://127.0.0.1:8000/health');
            const data = await response.json();
            updateStatus(data);
            updateLastChecked();
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('services-container').innerHTML = '<p>Error fetching service status.</p>';
        }
    }

    function updateStatus(data) {
        const container = document.getElementById('services-container');

        Object.entries(data.services).forEach(([serviceName, serviceData]) => {
            let serviceElement = document.getElementById(`service-${serviceName}`);

            if (!serviceElement) {
                serviceElement = createServiceElement(serviceName, serviceData);
                container.appendChild(serviceElement);
            } else {
                updateServiceElement(serviceElement, serviceData);
            }

            serviceElement.classList.add('heartbeat');
            setTimeout(() => serviceElement.classList.remove('heartbeat'), 500);
        });
    }

    function createServiceElement(serviceName, serviceData) {
        const serviceElement = document.createElement('div');
        serviceElement.className = 'service';
        serviceElement.id = `service-${serviceName}`;
        updateServiceElement(serviceElement, serviceData, serviceName);
        return serviceElement;
    }

    function updateServiceElement(serviceElement, serviceData, serviceName) {
        const statusClass = serviceData.running ? 'green' : 'red';
        const statusText = serviceData.running ? 'Available' : 'Unavailable';

        serviceElement.innerHTML = `
            <div class="service-name">${serviceName || serviceElement.querySelector('.service-name').textContent}</div>
            <div class="status-icon ${statusClass}"></div>
            <div class="service-status">${statusText}</div>
            <div class="service-details">
                <span class="service-detail">Host: ${serviceData.host}</span>
                <span class="service-detail">Port: ${serviceData.port}</span>
            </div>
        `;
    }

    function updateLastChecked() {
        const now = new Date();
        document.getElementById('last-updated').textContent = `Last updated: ${now.toLocaleTimeString()}`;
    }

    function startPolling() {
        fetchStatus(); // Initial fetch
        setInterval(fetchStatus, POLL_INTERVAL);
    }

    startPolling();
</script>
</body>
</html>
